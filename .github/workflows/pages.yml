name: Web page

# Publishes Paddock's page (site/, with the README's pictures) to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/images/**"
      - "Resources/AppIcon.svg"
      - "Scripts/build-site.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Two jobs, not one: the deploy step looks the uploaded artifact up by listing the run's artifacts, and in the
  # same job it asked a fraction of a second after the upload, before the list had it ("Found 0 artifact(s)").
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the page
        run: Scripts/build-site.sh _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read     # the deploy step looks up the artifact the build job uploaded
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
