<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
@font-face { font-family: "Bricolage Grotesque"; src: url("fonts/BricolageGrotesque.ttf") format("truetype"); font-weight: 200 800; }
html, body { margin: 0; }
body { width: 1280px; height: 640px; overflow: hidden; background: #e8e3d9; color: #2b2014; font-family: -apple-system, "Helvetica Neue", sans-serif; display: grid; grid-template-columns: 1fr 380px; align-items: center; }
.text { padding: 0 0 0 80px; }
.brand { display: flex; align-items: center; gap: 18px; font: 800 44px/1 "Bricolage Grotesque", sans-serif; letter-spacing: -0.02em; margin-bottom: 34px; }
.brand img { width: 76px; height: 76px; }
h1 { margin: 0 0 26px; font: 800 104px/0.94 "Bricolage Grotesque", sans-serif; letter-spacing: -0.035em; }
p { margin: 0; font-size: 31px; line-height: 1.35; color: #5c5041; max-width: 700px; }
.shot { width: 300px; border-radius: 14px; border: 1px solid #c9c1b2; box-shadow: 0 16px 40px rgba(43,32,20,.2), 0 2px 6px rgba(43,32,20,.1); }
</style></head>
<body>
  <div class="text">
    <div class="brand"><img src="icon.svg" alt="">Paddock</div>
    <h1>Sites that just work.</h1>
    <p>A local PHP and Laravel environment for Intel Macs. One command to install.</p>
  </div>
  <img class="shot" src="images/menu-running-light.png" alt="">
</body></html>
